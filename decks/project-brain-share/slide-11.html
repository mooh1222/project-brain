<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=960, initial-scale=1">
  <title>project-brain 공유 자료 - 11</title>
  <link rel="stylesheet" href="./assets/project-brain-share.css">
  <style>
    .closing { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 42pt; align-items: center; height: 260pt; }
    .loop { position: relative; height: 210pt; }
    .loop .node { position: absolute; width: 108pt; padding: 11pt; text-align: center; }
  </style>
</head>
<body>
  <main class="slide">
    <section class="closing" aria-label="같이 쓰기 위한 운영 원칙">
      <div class="title-stack">
        <p class="kicker">TEAM USE</p>
        <h2>핵심은 많이 쌓기가 아니라<br>다시 쓸 수 있게 쌓기</h2>
        <p class="subhead">근거, 검수 상태, 운영 루틴이 유지될 때 프로젝트 기억이 팀 자산이 된다.</p>
      </div>
      <div class="loop">
        <div class="hairline" style="left:84pt; top:54pt; width:94pt;"></div>
        <div class="hairline" style="left:151pt; top:91pt; width:88pt; transform:rotate(84deg);"></div>
        <div class="hairline" style="left:84pt; top:154pt; width:94pt;"></div>
        <div class="hairline" style="left:20pt; top:91pt; width:88pt; transform:rotate(84deg);"></div>
        <div class="node" style="left:0; top:20pt;"><p class="label">CAPTURE</p><p>raw + objects</p></div>
        <div class="node active" style="right:0; top:20pt;"><p class="label">REVIEW</p><p>근거 확실→reviewed<br>애매→candidate</p></div>
        <div class="node" style="right:0; bottom:0;"><p class="label">RECALL</p><p>질문에 맞게 회수</p></div>
        <div class="node" style="left:0; bottom:0;"><p class="label">MAINTAIN</p><p>audit + stale-check</p></div>
      </div>
    </section>
    <footer class="footer">
      <p>팀 공유 전에는 권한, 검수 기준, 운영 루틴을 정해야 한다</p>
      <p>11 / 11</p>
    </footer>
  </main>
</body>
</html>
