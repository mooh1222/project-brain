<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=960, initial-scale=1">
  <title>project-brain 공유 자료 - 02</title>
  <link rel="stylesheet" href="./assets/project-brain-share.css">
  <style>
    .scatter { position: relative; height: 210pt; margin-top: 10pt; }
    .scatter .node { position: absolute; width: 116pt; padding: 12pt; }
    .memory { position: absolute; right: 0; top: 58pt; width: 152pt; padding: 16pt; }
  </style>
</head>
<body>
  <main class="slide surface">
    <section class="topline">
      <div>
        <p class="kicker">WHY</p>
        <h2>프로젝트 지식은 흩어지고<br>사람은 쉽게 잊는다</h2>
      </div>
      <p class="caption">코드, 기획서, 대화, PR, 결정 기록이 서로 다른 위치에 남는다.</p>
    </section>
    <section class="scatter" aria-label="흩어진 프로젝트 지식">
      <div class="hairline muted" style="left:48pt; top:112pt; width:414pt;"></div>
      <div class="hairline muted" style="left:186pt; top:67pt; width:230pt; transform:rotate(15deg);"></div>
      <div class="node" style="left:0; top:18pt;"><p class="label">SOURCE</p><p>기획서와 위키</p></div>
      <div class="node" style="left:150pt; top:0;"><p class="label">CODE</p><p>파일과 심볼</p></div>
      <div class="node" style="left:64pt; top:132pt;"><p class="label">THREAD</p><p>슬랙과 세션</p></div>
      <div class="node" style="left:280pt; top:118pt;"><p class="label">CHANGE</p><p>PR과 커밋</p></div>
      <div class="memory node active">
        <p class="label">NEED</p>
        <p>질문 시점에 필요한 조각만 근거와 함께 꺼내야 한다.</p>
      </div>
    </section>
    <footer class="footer">
      <p>없으면 없다고 말할 수 있어야 안전하다</p>
      <p>02 / 11</p>
    </footer>
  </main>
</body>
</html>
