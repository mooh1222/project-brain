<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=960, initial-scale=1">
  <title>project-brain 공유 자료 - 09</title>
  <link rel="stylesheet" href="./assets/project-brain-share.css">
  <style>
    .ops-flow { margin-top: 32pt; }
    .ops-flow .stage { position: relative; min-height: 88pt; padding: 13pt 10pt 10pt; }
    .ops-flow .badge { position: absolute; top: -13pt; left: 10pt; }
    .ops-flow .stage p:not(.label):not(.badge) { font-size: 12.5pt; }
    .audit-row { margin-top: 18pt; display: grid; grid-template-columns: repeat(4, 1fr); gap: 9pt; }
    .audit-row .lane { padding: 8pt; border-color: var(--rule); }
    .audit-row p { font-size: 10.5pt; text-align: center; }
  </style>
</head>
<body>
  <main class="slide surface">
    <section class="topline">
      <div>
        <p class="kicker">OPERATING LOOP</p>
        <h2>근거로 상태를 정해<br>쌓는다</h2>
      </div>
      <p class="caption">많이 저장하는 것보다 근거와 상태를 유지하는 운영 흐름이 더 중요하다.</p>
    </section>
    <section class="ops-flow" aria-label="적재와 검수 흐름">
      <div class="flow-row five">
        <div class="stage">
          <p class="badge">1</p>
          <p class="label">NOTE</p>
          <p>구조화 노트</p>
        </div>
        <div class="stage">
          <p class="badge">2</p>
          <p class="label">BUILD</p>
          <p>객체 묶음 조립</p>
        </div>
        <div class="stage active">
          <p class="badge">3</p>
          <p class="label">INGEST</p>
          <p>근거 서면 reviewed 저장</p>
        </div>
        <div class="stage">
          <p class="badge">4</p>
          <p class="label">PROMOTE</p>
          <p>candidate를 reviewed로</p>
        </div>
        <div class="stage">
          <p class="badge">5</p>
          <p class="label">RECALL</p>
          <p>search / show</p>
        </div>
      </div>
      <div class="audit-row" aria-label="점검 명령">
        <div class="lane"><p>audit</p></div>
        <div class="lane"><p>lint</p></div>
        <div class="lane"><p>graph isolated</p></div>
        <div class="lane"><p>stale-check</p></div>
      </div>
    </section>
    <footer class="footer">
      <p>mark-checked는 의미가 그대로인 코드 연결의 확인 상태를 갱신한다</p>
      <p>09 / 11</p>
    </footer>
  </main>
</body>
</html>
