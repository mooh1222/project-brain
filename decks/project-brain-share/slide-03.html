<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=960, initial-scale=1">
  <title>project-brain 공유 자료 - 03</title>
  <link rel="stylesheet" href="./assets/project-brain-share.css">
  <style>
    .agent-flow { margin-top: 35pt; }
    .agent-flow .stage { position: relative; min-height: 84pt; padding: 13pt 12pt 12pt; }
    .agent-flow .badge { position: absolute; top: -13pt; left: 12pt; }
  </style>
</head>
<body>
  <main class="slide">
    <section class="title-stack">
      <p class="kicker">IDENTITY</p>
      <h2 class="headline">사람이 직접 뒤지는 도구가 아니라,<br>에이전트가 호출하는 지식 엔진</h2>
      <p class="subhead">질문은 사람에게서 오고, 검색과 조립은 에이전트가 맡는다.</p>
    </section>
    <section class="flow-row agent-flow" aria-label="사용자와 에이전트 흐름">
      <div class="stage">
        <p class="badge">1</p>
        <p class="label">USER</p>
        <p>질문하거나 작업을 맡긴다</p>
      </div>
      <div class="stage">
        <p class="badge">2</p>
        <p class="label">AGENT</p>
        <p>필요한 지식을 판단한다</p>
      </div>
      <div class="stage active">
        <p class="badge">3</p>
        <p class="label">BRAIN</p>
        <p>근거와 검수 상태를 회수한다</p>
      </div>
      <div class="stage">
        <p class="badge">4</p>
        <p class="label">ANSWER</p>
        <p>근거 있는 답을 만든다</p>
      </div>
    </section>
    <footer class="footer">
      <p>raw 문서와 구조화 객체를 함께 쓴다</p>
      <p>03 / 11</p>
    </footer>
  </main>
</body>
</html>
