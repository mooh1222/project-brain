[project]
name = "project-brain"
version = "0.1.0"
description = "프로젝트 도메인 지식 brain — 검수된 객체 코퍼스 + 한국어 하이브리드 검색(FTS5+벡터+RRF+그래프 재정렬) + 회상 CLI"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "sqlite-vec",
    "sentence-transformers",
    # 한국어 토크나이저 단일 백엔드(#79). ★버전을 고정한다★ — 올리면 토큰이 바뀌어
    # 기존 색인이 규칙 가드에 걸리므로 업그레이드는 의식적인 결정이어야 한다.
    "kiwipiepy==0.23.2",
    "kiwipiepy_model==0.23.0",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-cpp==0.23.4",
]

[project.scripts]
project-brain = "project_brain.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
